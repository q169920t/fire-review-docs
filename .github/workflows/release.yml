# 發布新版：自動編譯 exe 並建立 GitHub Release
# 觸發方式（任一）：
#   1. main 上 CHANGELOG.md 有「## vX.Y（日期）」且 vX.Y 還沒發布（X.Y = 主程式 APP_VERSION）
#      → 段落標題寫「（尚未發布）」時不會發布
#   2. 推送 vX.Y 標籤
# Release 會附上三個檔案，程式的線上更新就是讀這三個：
#   latest.json        最新版本號與更新說明
#   app.html           主程式畫面
#   FireReviewDocs.exe 程式本體（外殼）
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: shell/go.mod
          cache-dependency-path: shell/go.sum

      - name: 檢查版本號、決定要不要發布
        id: ver
        run: |
          APP=$(grep -oP "APP_VERSION = '\K[0-9.]+" "app/審勘文件管理.html")
          SHELL_VER=$(grep -oP 'const ShellVersion = "\K[0-9.]+' shell/main.go)
          echo "app=$APP shell=$SHELL_VER ref=$GITHUB_REF"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "shell=$SHELL_VER" >> "$GITHUB_OUTPUT"
          GO=no
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$APP" ]; then echo "::error::標籤 $GITHUB_REF_NAME 和主程式版本 $APP 不一致"; exit 1; fi
            GO=yes
          else
            HEAD_LINE=$(grep -m1 "^## v$APP（" CHANGELOG.md || true)
            if [ -z "$HEAD_LINE" ]; then echo "CHANGELOG 沒有 v$APP 段落，不發布"
            elif echo "$HEAD_LINE" | grep -q "尚未發布"; then echo "v$APP 標示尚未發布，不發布"
            elif [ "$(gh release view "v$APP" --json isDraft,assets -q 'if .isDraft then 0 else (.assets|length) end' 2>/dev/null || echo 0)" = "3" ]; then echo "v$APP 已經發布過"
            else GO=yes; fi
          fi
          echo "release=$GO" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 測試與編譯
        if: steps.ver.outputs.release == 'yes'
        run: |
          cp "app/審勘文件管理.html" shell/app.html
          (cd shell && go vet ./... && go test ./...)
          bash shell/build.sh
          cp "app/審勘文件管理.html" dist/app.html

      - name: 產生更新資訊
        if: steps.ver.outputs.release == 'yes'
        run: |
          # 從 CHANGELOG.md 取出這一版的說明
          awk -v v="## v${{ steps.ver.outputs.app }}" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md | sed '/./,$!d' > dist/notes.md
          [ -s dist/notes.md ] || echo "（這一版沒有寫更新說明）" > dist/notes.md
          jq -n --arg app "${{ steps.ver.outputs.app }}" --arg shell "${{ steps.ver.outputs.shell }}" \
                --rawfile notes dist/notes.md '{app: $app, shell: $shell, notes: $notes}' > dist/latest.json
          cat dist/latest.json

      - name: 建立 Release
        if: steps.ver.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.app }}"
          FILES="dist/FireReviewDocs.exe dist/app.html dist/latest.json"
          # GitHub 偶爾回 502：先重試，最後改成「先建立 Release、再上傳檔案」
          for i in 1 2 3; do
            if gh release create "$V" --target "$GITHUB_SHA" $FILES --title "$V" --notes-file dist/notes.md; then exit 0; fi
            echo "第 $i 次建立失敗，清掉殘留後重試"
            gh release delete "$V" --yes --cleanup-tag 2>/dev/null || true
            sleep 20
          done
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --target "$GITHUB_SHA" --title "$V" --notes-file dist/notes.md
          for i in 1 2 3 4 5; do
            gh release upload "$V" $FILES --clobber && break
            echo "上傳失敗，重試 $i"; sleep 15
          done
          gh release view "$V" --json assets -q '.assets[].name' | sort
          [ "$(gh release view "$V" --json assets -q '.assets | length')" = "3" ]
