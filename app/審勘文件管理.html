<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消防審勘文件管理</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1f2328; --sub:#5b6370; --line:#d9dde3; --soft:#eef1f5;
  --brand:#b4232a; --brand-ink:#fff; --brand-soft:#fbeaea;
  --ok:#1a7f37; --ok-soft:#e6f4ea; --warn:#9a6700; --warn-soft:#fff5d6; --err:#c21f2e; --err-soft:#fde8ea;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#2b2f36;color:#fff}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
header h1 span{display:inline-block;background:var(--brand);padding:1px 8px;border-radius:4px;margin-right:8px;font-size:13px}
header .meta{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px;color:#c9ced6}
header .meta input{width:90px;padding:3px 6px;border-radius:4px;border:1px solid #555;background:#3a3f47;color:#fff}
.layout{display:flex;height:calc(100% - 46px)}
nav{width:178px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
nav .sec{font-size:12px;color:var(--sub);padding:12px 10px 4px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:15px}
nav button:hover{background:var(--soft)}
nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
main{flex:1;overflow:auto;padding:20px 26px 60px}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3 .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px;align-items:center;justify-content:center}
.btn{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:2px 9px;font-size:13px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 16px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
label.f .req{color:var(--err)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink);font-size:15px;min-width:0}
input[type=text]:focus,select:focus,textarea:focus{outline:2px solid #e9a3a7;border-color:var(--brand)}
input.bad{border-color:var(--err);background:var(--err-soft)}
.checks{display:flex;flex-wrap:wrap;gap:6px 8px}
.chk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:16px;padding:3px 11px;cursor:pointer;user-select:none;background:#fff;font-size:14px}
.chk input{margin:0;accent-color:var(--brand)}
.chk.on{background:var(--brand-soft);border-color:#e7b3b6}
.grp{margin-bottom:14px}
.grp>.t{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;display:flex;gap:10px;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700;color:var(--sub);font-size:13px;white-space:nowrap}
td input[type=text]{width:100%}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:10px;background:var(--soft);color:var(--sub);margin:1px 2px 1px 0;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.msgs{margin:0;padding:0;list-style:none}
.msgs li{padding:6px 10px;border-radius:6px;margin-bottom:5px;font-size:14px}
.msgs li.err{background:var(--err-soft);color:var(--err)}
.msgs li.warn{background:var(--warn-soft);color:var(--warn)}
.msgs li.ok{background:var(--ok-soft);color:var(--ok)}
.msgs li.info{background:var(--soft);color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.mono{font-family:Consolas,monospace}
.welcome{max-width:640px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 34px}
.welcome h2{font-size:22px}
.welcome ol{padding-left:20px;color:var(--sub)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.preview{position:sticky;top:0;height:calc(100vh - 120px);background:#525659;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#ccc}
.preview iframe{width:100%;height:100%;border:0;background:#fff}
tr.sel td{background:#fff4f4}
.overlay{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:10px;max-width:620px;width:calc(100% - 40px);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .hd{padding:14px 20px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line)}
.modal .bd{padding:14px 20px;overflow:auto}
.modal .ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#2b2f36;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.sticky-actions{position:sticky;bottom:-60px;background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 10px;display:flex;gap:10px;align-items:center}
main.wide{padding-right:16px}
.genwrap{display:grid;grid-template-columns:minmax(420px,1fr) minmax(380px,1fr);gap:16px;align-items:start}
.card.step{transition:box-shadow .15s,border-color .15s}
.card.step.active{border-color:#e7b3b6;box-shadow:0 0 0 3px var(--brand-soft)}
.pvpane{position:sticky;top:0;height:calc(100vh - 86px);background:#fff;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.pvhead{padding:10px 12px 0;border-bottom:1px solid var(--line);background:var(--soft)}
.pvtitle{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:6px}
.pvtabs{display:flex;gap:4px;flex-wrap:wrap}
.pvtabs button{border:1px solid var(--line);border-bottom:0;background:#fff;padding:5px 12px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;color:var(--sub)}
.pvtabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pvbody{flex:1;overflow:auto;background:#8a8f96}
.pvbody .docx-wrapper{background:#8a8f96 !important;padding:16px !important}
.pvempty{color:var(--sub);padding:40px 20px;text-align:center;background:#fff;height:100%}
mark.pvmiss{background:#ffe066;color:#7a5a00;border-radius:2px;padding:0 2px;font-size:.9em}
span.pvval{color:#0b57d0}
.pvbody p[data-pi]{cursor:text}
.pvbody p[data-pi]:hover{outline:2px dashed rgba(180,35,42,.45);outline-offset:2px}
.pvbody p.pved{text-decoration:underline dotted #d08000;text-decoration-thickness:2px;text-underline-offset:3px;background:rgba(255,214,102,.18)}
.pvedits{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub);padding:4px 0 2px}
.pvedits b{color:#9a6700}
.edhint{font-size:13px;color:var(--sub);margin:0 0 8px;line-height:1.6}
.edhint code{color:#0b57d0}
.ederr{color:var(--err);font-size:13px;margin-top:6px}
.editbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid #f0d58a;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
.chglist{margin:6px 0 10px;padding-left:20px;max-height:180px;overflow:auto;font-size:14px}
.chglist del{color:var(--err)}.chglist ins{color:var(--ok);text-decoration:none;font-weight:600}
.cltable{font-family:"標楷體","DFKai-SB","Microsoft JhengHei",serif;font-size:15px;border:2px solid #222}
.cltable th,.cltable td{border:1px solid #444;padding:6px 6px;vertical-align:middle}
.cltable th{background:#f1f1f1;color:#222;text-align:center;font-size:15px}
.cltable td.c{text-align:center}
.cltable td.rm{font-size:12px;color:#444}
.cltable td.clc{text-align:center;cursor:pointer;user-select:none;width:44px}
.cltable td.clc:hover{background:#fff2f2}
.cltable td.clc.on{background:#fbeaea}
.clbox{font-size:20px;line-height:1}
.cltable td.clc.on .clbox{color:var(--brand)}
@media (max-width:1100px){.genwrap{grid-template-columns:1fr}.pvpane{position:relative;height:75vh}}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--soft);font-size:13px}
.updbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-bottom:1px solid var(--line);padding:8px 16px;font-size:14px}
.updbar details{flex-basis:100%}.updbar pre{white-space:pre-wrap;margin:6px 0 0;font-family:inherit}
</style>
</head>
<body>
<header>
  <h1><span>消防</span>審勘文件管理</h1>
  <div class="meta">
    <span id="rootName" title="點一下可改選其他系統資料夾" style="cursor:pointer;text-decoration:underline dotted">尚未選擇系統資料夾</span>
    <label>使用者 <input id="userName" type="text" placeholder="你的名字"></label>
    <span id="appVer"></span>
  </div>
</header>
<div class="layout" id="layout" style="display:none">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="welcome"></div>

<script>
'use strict';
/* ==================== 基本工具 ==================== */
const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const SETTINGS_FILE = '系統設定.json';
const CASE_FILE = '案件資料.json';
const APP_VERSION = '1.8';
const TPL_DIR = 'templates';
const BAD_CHARS = /[\\/:*?"<>|]/;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function rocToday() {
  const d = new Date(), p = S.settings?.options?.padDate !== false;
  return { 年份: String(d.getFullYear() - 1911), 月份: p ? pad2(d.getMonth() + 1) : String(d.getMonth() + 1), 日份: p ? pad2(d.getDate()) : String(d.getDate()) };
}
function rocStamp(ms) {
  const d = new Date(ms);
  return `${d.getFullYear() - 1911}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function toast(msg, ms = 2600) {
  const t = h('div', { class: 'toast' }, msg); document.body.append(t);
  setTimeout(() => t.remove(), ms);
}
function modal(title, body, buttons = [{ label: '確定', value: true, primary: true }]) {
  return new Promise(res => {
    const ov = h('div', { class: 'overlay' });
    const close = v => { ov.remove(); res(v); };
    const bd = h('div', { class: 'bd' }); if (typeof body === 'string') bd.innerHTML = body; else bd.append(body);
    ov.append(h('div', { class: 'modal' }, h('div', { class: 'hd' }, title), bd,
      h('div', { class: 'ft' }, buttons.map(b => h('button', { class: 'btn' + (b.primary ? ' primary' : ''), onclick: () => close(b.value) }, b.label)))));

}
const msgList = items => h('ul', { class: 'msgs' }, items.map(m => h('li', { class: m.type }, m.text)));
async function confirmBox(title, html, ok = '確定', cancel = '取消') {
  return modal(title, html, [{ label: cancel, value: false }, { label: ok, value: true, primary: true }]);
}

  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

/* ==================== Word 文件核心 ==================== */
const isWordPart = n => /^word\/(document|header\d*|footer\d*|footnotes|endnotes)\.xml$/.test(n);
function wEls(node, local) { return Array.from(node.getElementsByTagNameNS(W, local)); }
function closestW(el, local) { let n = el.parentNode; while (n && !(n.namespaceURI === W && n.localName === local)) n = n.parentNode; return n; }
function directKids(el, local) { return Array.from(el.childNodes).filter(n => n.namespaceURI === W && n.localName === local); }
function paraTexts(p) { return wEls(p, 't').filter(t => closestW(t, 'p') === p); }
function cellText(tc) { return wEls(tc, 't').map(t => t.textContent).join('').trim(); }
function rowNo(tr) { const tc = directKids(tr, 'tc')[0]; if (!tc) return null; const t = cellText(tc); return /^\d+$/.test(t) ? Number(t) : null; }
const MARK = /\{([^{}]*)\}/g;
/* {□畫面名稱=文件印的字} */
function parseCheck(name) { const k = name.replace(/^□/, '').trim(); const i = k.indexOf('='); return i < 0 ? { id: k, print: k } : { id: k.slice(0, i).trim(), print: k.slice(i + 1).trim() }; }
const checkInputMap = () => Object.fromEntries((S.settings?.checkInputs || []).map(x => [x.check, x.field]));
const clState = no => S.cs.cl[no] || '不須';

async function loadDocx(buf) {
  const zip = await JSZip.loadAsync(buf);
  const parts = [];
  for (const name of Object.keys(zip.files).filter(isWordPart)) {
    const xml = await zip.file(name).async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('Word 檔內容無法解析：' + name);
    parts.push({ name, doc });
  }
  return { zip, parts };
}

/* 分析模板：找出欄位、勾選框、格式錯誤、檢查表項次 */
async function analyzeTemplate(buf) {
  const info = { fields: {}, checks: {}, generic: 0, errors: [], warnings: [], items: [], condCl: {}, condChecks: {} };
  let pkg;
  try { pkg = await loadDocx(buf); } catch (e) { info.errors.push('無法開啟這個 Word 檔（' + e.message + '）。請確認是 .docx 格式且沒有損壞。'); return info; }
  for (const { doc } of pkg.parts) {
    for (const p of wEls(doc, 'p')) {
      const text = paraTexts(p).map(t => t.textContent).join('');
      if (!/[{}]/.test(text)) continue;
      const rest = text.replace(MARK, '');
      if (/[{}]/.test(rest)) info.errors.push(`大括號不成對：「${text.trim().slice(0, 60)}」`);
      for (const m of text.matchAll(MARK)) {
        const raw = m[1], name = raw.trim();
        if (raw !== name) info.warnings.push(`標記 {${raw}} 的大括號內有多餘空格，系統會當成 {${name}} 處理，建議修正。`);
        if (!name) { info.errors.push('發現空白標記 {}'); continue; }
        if (name === '序') continue;
        if (isCondMark(name)) {
          for (const g of condTerms(name.replace(/^列[:：]/, ''))) for (const t of g) {
            if (/^\d+$/.test(t)) info.condCl[t] = 1;
            else if (t.startsWith('□')) info.condChecks[parseCheck(t).id] = 1;
            else info.warnings.push(`條件標記 {${name}} 裡的「${t}」看不懂：請寫資料檢查表項次（例如 13）或勾選框（例如 □變更使用）。`);
          }
          continue;
        }
        if (name === '□') info.generic++;
        else if (name.startsWith('□')) { const k = parseCheck(name).id; info.checks[k] = (info.checks[k] || 0) + 1; }
        else info.fields[name] = (info.fields[name] || 0) + 1;
      }
    }
    for (const tr of wEls(doc, 'tr')) {
      const no = rowNo(tr); if (no == null) continue;
      const tcs = directKids(tr, 'tc');
      info.items.push({ no, name: tcs[1] ? cellText(tcs[1]) : '', remark: tcs.length >= 6 ? cellText(tcs[tcs.length - 1]) : '' });
    }
  }
  for (const [k, n] of Object.entries(info.checks)) if (n > 1 && !/^[有無]-/.test(k))
    info.warnings.push(`勾選框 {□${k}} 在這份文件出現 ${n} 次，會一起被勾選或不勾選。若意義不同，請改成不同名稱。`);
  return info;
}

/* 填入資料：resolve(name, ctx) 傳回要替換的文字 */
/* ---------- 段落文字修改（產出前在預覽上直接改字） ---------- */
// 段落的「文字元素」：文字、定位點（\t）、換行（\n）；分頁符號不動
const isTextEl = c => c.namespaceURI === W && (c.localName === 't' || c.localName === 'tab' || c.localName === 'cr' ||
  (c.localName === 'br' && !['page', 'column'].includes(c.getAttributeNS(W, 'type') || c.getAttribute('w:type'))));
const paraRuns = p => wEls(p, 'r').filter(r => closestW(r, 'p') === p);
function paraPlain(p) {
  let s = '';
  for (const r of paraRuns(p)) for (const c of r.childNodes) if (isTextEl(c)) s += c.localName === 't' ? c.textContent : c.localName === 'tab' ? '\t' : '\n';
  return s;
}
// 整段換成新文字，沿用第一段文字的字型格式
function setParaText(p, text) {
  const runs = paraRuns(p).filter(r => [...r.childNodes].some(isTextEl));
  if (!runs.length) return false;
  const first = runs[0], doc = p.ownerDocument;
  for (const r of runs) for (const c of [...r.childNodes]) if (isTextEl(c)) r.removeChild(c);
  String(text).split('\n').forEach((line, li) => {
    if (li) first.appendChild(doc.createElementNS(W, 'w:br'));
    line.split('\t').forEach((seg, si) => {
      if (si) first.appendChild(doc.createElementNS(W, 'w:tab'));
      if (seg) { const t = doc.createElementNS(W, 'w:t'); t.setAttribute('xml:space', 'preserve'); t.textContent = seg; first.appendChild(t); }
    });
  });
  return true;
}
// 預覽時在每段開頭放看不見的段落編號，畫面上點哪一段才知道對應模板的哪一段
const PI_RE = /([-]+)/g;
const piTag = i => '' + String(i).split('').map(d => String.fromCharCode(0xE010 + +d)).join('') + '';
const piNum = s => +s.split('').map(c => c.charCodeAt(0) - 0xE010).join('');
const bodyParas = pkg => { const part = pkg.parts.find(x => x.name === 'word/document.xml'); return part ? wEls(part.doc, 'p') : []; };

/* 填入資料：opt.edits = { 段落編號: 新文字 }；opt.tag = 預覽用段落編號 */
// □ ■ 要用中文字型顯示，否則 Word 會改用英文字型，看起來比前後的字小
function ensureEAHint(r) {
  if (!r || r.namespaceURI !== W || r.localName !== 'r') return;
  const doc = r.ownerDocument;
  let rPr = directKids(r, 'rPr')[0];
  if (!rPr) { rPr = doc.createElementNS(W, 'w:rPr'); r.insertBefore(rPr, r.firstChild); }
  let f = directKids(rPr, 'rFonts')[0];
  if (!f) { f = doc.createElementNS(W, 'w:rFonts'); const st = directKids(rPr, 'rStyle')[0]; rPr.insertBefore(f, st ? st.nextSibling : rPr.firstChild); }
  f.setAttributeNS(W, 'w:hint', 'eastAsia');
}
/* 條件標記：{列:13} 資料檢查表第 13 項不是「不須」才保留這一行；{列:□變更使用} 有勾才保留；
   逗號＝而且、|＝或者；{序} 依保留下來的順序自動編號 */
const COND_RE = /\{\s*列[:：]([^{}]*)\}/g;
const isCondMark = n => /^列[:：]/.test(n);
function condTerms(expr) { return expr.split(/[,，]/).map(g => g.split(/[|｜]/).map(t => t.trim()).filter(Boolean)); }
function condEval(expr) {
  return condTerms(expr).every(g => !g.length || g.some(t =>
    /^\d+$/.test(t) ? clState(+t) !== '不須' : t.startsWith('□') ? !!S.cs.checks[parseCheck(t).id] : false));
}
function applyConds(doc, cond) {
  const rows = new Set();
  for (const p of wEls(doc, 'p')) {
    const ts = paraTexts(p); if (!ts.length) continue;
    const full = ts.map(t => t.textContent).join('');
    if (!/\{\s*列[:：]/.test(full)) continue;
    if ([...full.matchAll(COND_RE)].every(m => cond(m[1]))) continue;
    const tc = closestW(p, 'tc'), tr = closestW(p, 'tr');
    if (tc && directKids(tc, 'p').length <= 1) { for (const c of [...p.childNodes]) if (!(c.namespaceURI === W && c.localName === 'pPr')) p.removeChild(c); }
    else p.parentNode.removeChild(p);
    if (tr) rows.add(tr);
  }
  for (const tr of rows) {   // 整列內容都被刪掉時，整列移除
    if (wEls(tr, 't').some(t => t.textContent.trim())) continue;
    const tbl = tr.parentNode; tbl.removeChild(tr);
    if (!directKids(tbl, 'tr').length && tbl.parentNode) tbl.parentNode.removeChild(tbl);
  }

/* 填入資料：opt.edits = { 段落編號: 新文字 }；opt.tag = 預覽用段落編號；opt.cond = 條件判斷（有給才處理 {列:}{序}） */
async function fillTemplate(buf, resolve0, opt = {}) {
  const pkg = await loadDocx(buf);
  const paras = bodyParas(pkg);
  if (opt.edits) for (const [i, t] of Object.entries(opt.edits)) if (paras[+i]) setParaText(paras[+i], t);
  let resolve = resolve0;
  if (opt.cond) {
    for (const part of pkg.parts) applyConds(part.doc, opt.cond);
    let seq = 0;
    resolve = (name, ctx) => isCondMark(name) ? '' : name === '序' ? String(++seq) : resolve0(name, ctx);
  }
  for (const part of pkg.parts) {
    const rowCount = new Map();
    for (const p of wEls(part.doc, 'p')) {
      const ts = paraTexts(p); if (!ts.length) continue;
      const texts = ts.map(t => t.textContent), full = texts.join('');
      if (!full.includes('{')) continue;
      const ms = [...full.matchAll(MARK)]; if (!ms.length) continue;
      const tr = closestW(p, 'tr');
      const reps = ms.map(m => {
        const name = m[1].trim(); let ctx = null;
        if (name === '□') { const c = rowCount.get(tr) || 0; rowCount.set(tr, c + 1); ctx = { row: tr ? rowNo(tr) : null, idx: c }; }
        return { s: m.index, e: m.index + m[0].length, v: resolve(name, ctx) };
      });
      const starts = []; let acc = 0; for (const t of texts) { starts.push(acc); acc += t.length; }
      const at = pos => { let i = 0; while (i + 1 < starts.length && starts[i + 1] <= pos) i++; return i; };
      const boxRuns = [];
      for (let i = reps.length - 1; i >= 0; i--) {
        const r = reps[i]; if (r.v == null) continue;
        const a = at(r.s), b = at(r.e - 1);
        if (/[■□]/.test(r.v)) boxRuns.push(ts[a].parentNode);
        if (a === b) texts[a] = texts[a].slice(0, r.s - starts[a]) + r.v + texts[a].slice(r.e - starts[a]);
        else {
          texts[a] = texts[a].slice(0, r.s - starts[a]) + r.v;
          for (let k = a + 1; k < b; k++) texts[k] = '';
          texts[b] = texts[b].slice(r.e - starts[b]);
        }
      }
      ts.forEach((t, i) => { if (t.textContent !== texts[i]) { t.textContent = texts[i]; t.setAttribute('xml:space', 'preserve'); } });
      boxRuns.forEach(ensureEAHint);
    }
    if (opt.tag && part.name === 'word/document.xml') paras.forEach((p, i) => {
      const ts = paraTexts(p); if (!ts.length) return;
      ts[0].textContent = piTag(i) + ts[0].textContent; ts[0].setAttribute('xml:space', 'preserve');
    });
    let xml = new XMLSerializer().serializeToString(part.doc);
    if (!xml.startsWith('<?xml')) xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n' + xml;
    pkg.zip.file(part.name, xml);
  }
  return pkg.zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}
async function leftoverMarks(blob) {
  const pkg = await loadDocx(await blob.arrayBuffer()); const left = new Set();

    const t = paraTexts(p).map(x => x.textContent).join('');
    for (const m of t.matchAll(MARK)) left.add(m[0]);

  return [...left];

function defaultSteps() {

/* 舊版設定檔升級 */
function migrateSettings(st) {

    if (!st.checkGroups.some(g => g.pairs)) st.checkGroups.push({ name: '檢附資料', pairs: true, items: ['建築申請書', '建使照', '建築圖', '樓層檢討表', '發電機計算書', '室內裝修資料', '其他'] });

    st.options.schema = 2; changed = true;

async function loadSettings() {

    const def = defaultSettings();
    for (const k of Object.keys(def)) if (S.settings[k] == null) S.settings[k] = def[k];
    S.loadedRev = S.settings.rev || 0;
    if (migrateSettings(S.settings)) await saveSettingsNow();
  } else {
    S.settings = defaultSettings();
    await saveSettingsNow(true);
  }
  S.loadedRev = S.settings.rev || 0;
}
let saveTimer = null;
function saveSettings() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveSettingsNow(), 700); }
async function saveSettingsNow(first) {
  clearTimeout(saveTimer);

async function scanTemplates() {
  const dir = await getSub(S.root, TPL_DIR);
  S.tplFiles = []; S.tplInfo = {};
  if (!dir) return;
  const names = await listFiles(dir, /\.(docx|doc)$/i);
  let changed = false;
  for (const name of names) {
    const f = await readFile(dir, name);
    const rec = S.settings.templates[name] || (S.settings.templates[name] = { history: [] });
    if (rec.lastModified !== f.lastModified) {
      rec.history.unshift({ at: Date.now(), fileTime: f.lastModified, by: userName(), note: rec.lastModified ? '偵測到檔案更新' : '初次登錄' });
      rec.lastModified = f.lastModified; changed = true;
    }
    let info;
    if (/\.doc$/i.test(name)) info = { fields: {}, checks: {}, generic: 0, items: [], warnings: [], errors: ['這是舊版 .doc 格式，系統無法讀寫。請用 Word 開啟後「另存新檔」為 .docx。'] };
    else info = await analyzeTemplate(await f.arrayBuffer());
    const known = new Set(S.settings.fields.map(x => x.name));
    info.unknown = Object.keys(info.fields).filter(k => !known.has(k));
    S.tplFiles.push({ name, size: f.size, lastModified: f.lastModified });
    S.tplInfo[name] = info;
  }
  if (changed) await saveSettingsNow();
}

// 資料檢查表上有對應項次的文件，依檢查表決定要不要產出：「不須」就不產出
function caseDocs() {
  const cat = catById(S.cs.category); if (!cat) return [];
  const clNos = new Set(checklistItems(cat).map(i => i.no));
  const key = d => d.no < 0 ? 1e4 : d.no;
  return cat.docIds.map(docById).filter(Boolean).map(d => {
    const ch = S.cs.docChoices[d.id] || { include: true, tpl: 0 };
    const t = d.templates[ch.tpl] || d.templates[0];
    const byCl = !d.checklist && d.no > 0 && clNos.has(d.no);
    return { doc: d, byCl, include: byCl ? clState(d.no) !== '不須' : ch.include !== false, tplIndex: ch.tpl || 0, file: t?.file, info: t && S.tplInfo[t.file] };

  const fields = new Set(), checks = new Set();
  for (const cd of caseDocs()) if (cd.include && cd.info) {

const noLabel = no => no < 0 ? '' : pad2(no);   // 項次為負數＝檔名不加編號

function validateCase() {
  const out = [], cs = S.cs, cat = catById(cs.category);
  const E = t => out.push({ type: 'err', text: t }), Wn = t => out.push({ type: 'warn', text: t });
  if (!cat) { E('請先選擇案件類別。'); return out; }
  if (!cs.abbr.trim()) E('請填寫「工程名稱縮寫」，產出的檔名會用到。');
  else if (BAD_CHARS.test(cs.abbr)) E('工程名稱縮寫不能包含這些符號：\\ / : * ? " < > |');
  const docs = caseDocs().filter(x => x.include);
  if (!docs.length) E('沒有勾選任何要產出的文件。');
  const seen = {};
  for (const cd of docs) {
    if (!cd.file) { E(`「${cd.doc.name}」沒有設定模板。`); continue; }
    if (!S.tplInfo[cd.file]) E(`找不到「${cd.doc.name}」的模板檔：${cd.file}（請確認 templates 資料夾）`);
    else for (const e of S.tplInfo[cd.file].errors) E(`模板「${cd.file}」有錯誤：${e}`);
    if (cd.info && cd.info.generic && !cd.doc.checklist) E(`「${cd.doc.name}」模板中有未命名的勾選框 {□}，只有資料檢查表可以這樣用，請改成 {□名稱}。`);
    if (seen[cd.doc.no]) E(`項次 ${cd.doc.no} 同時對應「${seen[cd.doc.no]}」和「${cd.doc.name}」，檔名會重複。`);
    seen[cd.doc.no] = cd.doc.name;
    if (BAD_CHARS.test(cd.doc.name)) E(`文件名稱「${cd.doc.name}」含有檔名不能用的符號。`);
  }
  for (const cd of docs) { const e = S.cs.edits && S.cs.edits[cd.doc.id];
    if (e && e.file !== cd.file && Object.keys(e.paras || {}).length) Wn(`「${cd.doc.name}」之前修改的文字是針對另一個版本（${e.file}），目前選的版本不同，這次不會套用。`); }
  const items = checklistItems(cat);
  if (items.length) for (const cd of docs) if (cd.doc.no > 0 && !items.some(i => i.no === cd.doc.no)) Wn(`「${cd.doc.name}」的項次 ${cd.doc.no} 不在資料檢查表上。`);
  if (items.length && docs.some(x => x.doc.checklist)) for (const cd of docs) if (cd.doc.no > 0 && clState(cd.doc.no) === '不須') Wn(`有產出「${cd.doc.name}」，但資料檢查表第 ${cd.doc.no} 項勾的是「不須」。`);
  const { fields, checks } = caseMarkers();

}

function resolver(cd, preview) {
  const cs = S.cs, ci = checkInputMap();
  const docFields = cd.info ? cd.info.fields : {};
  const val = (name, s) => preview ? (s ? '⟪' + s + '⟫' : '⟦' + name + '⟧') : s;
  return (name, ctx) => {
    if (name === '□') {
      if (!cd.doc.checklist || !ctx || ctx.row == null) return '□';
      const st = clState(ctx.row);
      return (ctx.idx === 0 ? st === '有' : ctx.idx === 1 ? st === '無' : st === '不須') ? '■' : '□';
    }
    if (name.startsWith('□')) {
      const { id, print } = parseCheck(name);
      if (/^[有無]-/.test(id)) { const has = cs.pairs[id.slice(2)] === '有'; return ((id[0] === '有') === has ? '■' : '□') + id[0]; }
      const on = !!cs.checks[id];
      let out = (on ? '■' : '□') + print;
      const f = ci[id];
      if (on && f && !docFields[f]) { const v = String(cs.values[f] ?? '').trim(); if (v || preview) out += '：' + val(f, v); }
      return out;
    }
    const isCi = Object.values(ci).includes(name);
    const s = String(cs.values[name] ?? '');
    if (preview && isCi && !s.trim()) return '';   // 勾選說明欄位未勾時不提示
    return preview ? val(name, s) : s;
  };
}

function markPreview(root) {

  while (walker.nextNode()) if (/[⟦⟪]/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  for (const t of nodes) {
    const frag = document.createDocumentFragment(); let last = 0; const s = t.nodeValue;
    for (const m of s.matchAll(/⟦([^⟧]*)⟧|⟪([^⟫]*)⟫/g)) {

      frag.append(m[1] != null ? h('mark', { class: 'pvmiss' }, m[1]) : h('span', { class: 'pvval' }, m[2]));
      last = m.index + m[0].length;

    frag.append(s.slice(last)); t.replaceWith(frag);
  }
}

}

  const warns = msgs.filter(m => m.type === 'warn');

  const sameDir = await out.isSameEntry(sc.dir);
  const exist = []; for (const j of jobs) if (!(sameDir && j.src === j.dst) && await fileExists(out, j.dst)) exist.push(j.dst);
  if (exist.length && !await confirmBox('檔案已存在', h('div', {}, h('p', {}, `「${out.name}」裡已經有：`), msgList(exist.map(t => ({ type: 'warn', text: t }))), h('p', {}, '要覆蓋嗎？')), '覆蓋')) return;

      const file = await readFile(sc.dir, j.src);

      report.push({ type: 'ok', text: `${j.src} → ${j.dst}` });

  if (sc.delSrc) { sc.files = await listFiles(sc.dir, /\.pdf$/i); sc.assign = {}; }
  render();
}

    h('table', {}, h('thead', {}, h('tr', {}, ['欄位名稱', '群組', '必填', '下拉選項（用頓號分隔）', '狀態', ''].map(t => h('th', {}, t)))), tb),
    h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: () => { st.fields.push({ name: '新欄位', group: '案件資料', required: true, options: [] }); saveSettings(); render(); } }, '＋ 新增欄位'))));
  const allChecks = [...new Set(Object.values(S.tplInfo).flatMap(i => Object.keys(i.checks)))].filter(k => !/^[有無]-/.test(k));
  const grouped = new Set(st.checkGroups.filter(g => !g.pairs).flatMap(g => g.items));
  main.append(h('div', { class: 'card' }, h('h3', {}, '勾選框分組'),
    h('p', { class: 'muted', style: 'margin-top:-6px' }, '只影響「文件產出」頁的排列方式。成對的有／無勾選框請在模板中寫成 {□有-項目名稱}{□無-項目名稱}，系統會顯示成一個「有／無」選單。'),
    st.checkGroups.map((g, i) => h('div', { class: 'row', style: 'margin-bottom:8px;flex-wrap:nowrap' },
      h('input', { type: 'text', value: g.name, style: 'width:120px', onchange: e => { g.name = e.target.value.trim(); saveSettings(); } }), g.pairs ? h('span', { class: 'tag' }, '有／無') : null,
      h('input', { type: 'text', value: g.items.join('、'), style: 'flex:1', onchange: e => { g.items = e.target.value.split(/[、,，]/).map(s => s.trim()).filter(Boolean); saveSettings(); render(); } }),
      h('button', { class: 'btn small danger', onclick: () => { st.checkGroups.splice(i, 1); saveSettings(); render(); } }, '刪除'))),
    h('button', { class: 'btn', onclick: () => { st.checkGroups.push({ name: '新分組', items: [] }); saveSettings(); render(); } }, '＋ 新增分組'),
    allChecks.filter(k => !grouped.has(k)).length ? h('p', { class: 'muted' }, '未分組的勾選框（會顯示在「其他勾選」）：' + allChecks.filter(k => !grouped.has(k)).join('、')) : null));
  main.append(h('div', { class: 'card' }, h('h3', {}, '日期格式'),
    h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: st.options.padDate !== false, onchange: e => { st.options.padDate = e.target.checked; saveSettings(); } }), '月、日補零（例如 04 月 05 日）')));
}

/* ==================== 說明 ==================== */
function viewHelp(main) {

<h3>日常作業</h3>
<ol>
<li><b>文件產出</b>：選類別 → 填工程名稱縮寫 → 用「從常用資料帶入」選設計師、建築師、業主 → 補齊案件資料與勾選項目 → 按「產出文件」，選擇 Google 雲端硬碟上已建立好的案件資料夾。</li>
<li>系統會在案件資料夾產出所有 Word 檔、<span class="kbd">${CASE_FILE}</span>（案件紀錄）和 <span class="kbd">用印檢查表.html</span>。</li>
<li>列印、用印後掃描，每份文件存成一個 PDF。</li>
<li><b>掃描檔改名</b>：選案件資料夾 → 選掃描檔資料夾 → 逐一預覽並選擇對應文件 → 「改名並存放」。</li>
<li><b>發現資料填錯</b>：到「③ 我的案件」找到案件 → 「打開修正」→ 改好資料 → 按「重新產出」。程式會列出改了什麼、影響哪幾份文件，只重新產出那幾份，舊檔備份在案件資料夾的「_舊版」。</li>
</ol>
<h3>模板標記規則</h3>
<ul>
<li><span class="kbd">{欄位名稱}</span>：填入文字，例如 {工程名稱}。名稱需在「欄位與勾選框」登記。</li>
<li><span class="kbd">{□名稱}</span>：勾選框，產出時變成「■名稱」或「□名稱」（名稱文字會保留）。同名的勾選框在所有文件中一起勾。</li>
<li><span class="kbd">{□有-項目}{□無-項目}</span>：成對的有／無，表單上顯示成一個選單，產出時只印「■有 □無」。</li>
<li><span class="kbd">{□}</span>：只用在資料檢查表，依所在列的項次自動判斷「有／無／不須」三格。</li>
</ul>
<h3>多人共用注意事項</h3>
<ul>
<li>所有設定存在系統資料夾的 <span class="kbd">${SETTINGS_FILE}</span>，Google 雲端硬碟同步後大家看到的都一樣。</li>
<li>如果別人剛好也改了設定，系統會提醒你先重新載入，避免互相覆蓋。改設定前，建議先等雲端硬碟同步完成。</li>
<li>修改 Word 模板時請直接覆蓋原檔，系統會自動記錄新版本與日期，可在「模板與版本」填寫修改說明。</li>
<li>每次開啟軟體，瀏覽器會詢問資料夾存取權限，按「允許」即可。</li>
</ul>` }));
}

$('#rootName').addEventListener('click', async () => {
  if (!S.root) return;
  if (!await confirmBox('改選系統資料夾', `目前使用「${esc(S.root.name)}」。要改選其他資料夾嗎？`, '改選')) return;
  const d = await pickDir('root'); if (d) { if (!await openRoot(d)) await openRoot(S.root); }
});
boot();
</script>
